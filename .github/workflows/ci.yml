name: CSMS CI and staging

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csms
          POSTGRES_USER: csms
          POSTGRES_PASSWORD: csms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csms -d csms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Lint Sprint 1 backend files
        working-directory: backend
        run: >-
          ruff check --isolated --select E4,E7,E9,F --ignore E501,E712
          app/api/deps.py
          app/api/v1/endpoints/auth.py
          app/api/v1/endpoints/chargers.py
          app/api/v1/endpoints/stations.py
          app/core/config.py
          app/core/security.py
          app/main.py
          app/models/auth.py
          app/models/user.py
          app/schemas/station.py
          app/schemas/user.py
          app/services/rbac_service.py
          app/services/station_service.py
          tests/test_auth.py
          tests/test_stations.py
          alembic/versions/a1b2c3d4e5f6_core_foundation.py
          alembic/versions/03906fa596ea_initial_schema_step07.py
          alembic/versions/f99adeda980d_add_checkpoint_and_soc_to_sessions.py
          alembic/versions/c2d3e4f5a6b7_sprint1_roles_login_throttle.py
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://csms:csms@localhost:5432/csms
          AUTO_CREATE_SCHEMA: "false"
          SECRET_KEY: ci-only-not-a-secret
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check Docker Compose configuration
        run: docker compose --env-file docker-compose.env.example config --quiet

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_base: ${{ steps.images.outputs.image_base }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image names
        id: images
        run: |
          image_base="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_base=$image_base" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish backend image
        run: |
          docker build -t "${{ steps.images.outputs.image_base }}/backend:${GITHUB_SHA}" ./backend
          docker push "${{ steps.images.outputs.image_base }}/backend:${GITHUB_SHA}"
      - name: Build and publish frontend image
        run: |
          docker build -t "${{ steps.images.outputs.image_base }}/frontend:${GITHUB_SHA}" ./frontend
          docker push "${{ steps.images.outputs.image_base }}/frontend:${GITHUB_SHA}"

  deploy-staging:
    if: needs.publish-images.result == 'success'
    needs: publish-images
    runs-on: ubuntu-24.04
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_PATH: ${{ secrets.STAGING_PATH }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
      STAGING_REGISTRY_USER: ${{ secrets.STAGING_REGISTRY_USER }}
      STAGING_REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
      IMAGE_BASE: ${{ needs.publish-images.outputs.image_base }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH access and upload deployment files
        if: env.STAGING_HOST != '' && env.STAGING_USER != '' && env.STAGING_PATH != '' && env.STAGING_SSH_KEY != '' && env.STAGING_KNOWN_HOSTS != ''
        run: |
          install -m 700 -d "$RUNNER_TEMP/csms-ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$RUNNER_TEMP/csms-ssh/key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/csms-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/csms-ssh/key" "$RUNNER_TEMP/csms-ssh/known_hosts"
          ssh_opts=(-i "$RUNNER_TEMP/csms-ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/csms-ssh/known_hosts")
          ssh "${ssh_opts[@]}" "$STAGING_USER@$STAGING_HOST" "mkdir -p '$STAGING_PATH'"
          scp "${ssh_opts[@]}" docker-compose.yml ops/deploy-staging.sh "$STAGING_USER@$STAGING_HOST:$STAGING_PATH/"
      - name: Sign in to the registry and deploy with health-check rollback
        if: env.STAGING_HOST != '' && env.STAGING_USER != '' && env.STAGING_PATH != '' && env.STAGING_SSH_KEY != '' && env.STAGING_KNOWN_HOSTS != '' && env.STAGING_REGISTRY_USER != '' && env.STAGING_REGISTRY_TOKEN != ''
        run: |
          ssh_opts=(-i "$RUNNER_TEMP/csms-ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/csms-ssh/known_hosts")
          printf '%s' "$STAGING_REGISTRY_TOKEN" | ssh "${ssh_opts[@]}" "$STAGING_USER@$STAGING_HOST" "docker login ghcr.io --username '$STAGING_REGISTRY_USER' --password-stdin"
          ssh "${ssh_opts[@]}" "$STAGING_USER@$STAGING_HOST" "bash '$STAGING_PATH/deploy-staging.sh' '$STAGING_PATH' '$IMAGE_BASE' '$IMAGE_TAG'"
      - name: Explain that staging secrets are not configured
        if: env.STAGING_HOST == '' || env.STAGING_USER == '' || env.STAGING_PATH == '' || env.STAGING_SSH_KEY == '' || env.STAGING_KNOWN_HOSTS == '' || env.STAGING_REGISTRY_USER == '' || env.STAGING_REGISTRY_TOKEN == ''
        run: |
          echo 'Staging deploy skipped: configure the documented STAGING_* repository secrets to enable it.'