# Ruff configuration cho EV CSMS Backend (FastAPI + SQLAlchemy + Alembic)

[lint]
# Bỏ qua các rule không phù hợp với FastAPI convention
ignore = [
    "B008",   # Depends() trong argument defaults là pattern chuẩn FastAPI
]

[lint.per-file-ignores]
# Alembic auto-generate dùng Union[] — không sửa file tự sinh
"backend/migrations/**" = ["UP007", "UP035", "I001"]
