services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ev_csms_backend_staging
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=EV Charging Station Management System
      - VERSION=1.0.0
      - API_V1_STR=/api/v1
      - DATABASE_URL=sqlite:////app/data/ev_csms.db
      - SECRET_KEY=staging_secret_key_change_in_production_jwt_ev_csms
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MAX_FAILED_LOGIN_ATTEMPTS=5
      - LOCKOUT_DURATION_MINUTES=15
      - NEGATIVE_BALANCE_LIMIT=-300000
      - MAX_SAFE_DEBT_LIMIT=-500000
      - BACKEND_CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173"]
    volumes:
      - staging_db_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ev_csms_frontend_staging
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  staging_db_data:
    driver: local
