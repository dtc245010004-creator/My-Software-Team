services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${STAGING_BACKEND_HOST_PORT:-8002}:8000"
    environment:
      PROJECT_NAME: EV Charging Station Management System
      VERSION: 1.0.0
      API_V1_STR: /api/v1
      DATABASE_URL: ${STAGING_DATABASE_URL:-sqlite:////app/data/ev_csms.db}
      SECRET_KEY: ${STAGING_SECRET_KEY:-staging_secret_key_change_in_production_jwt_ev_csms}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      MAX_FAILED_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_MINUTES: 15
      NEGATIVE_BALANCE_LIMIT: -300000
      MAX_SAFE_DEBT_LIMIT: -500000
      BACKEND_CORS_ORIGINS: '["http://localhost:8081", "http://127.0.0.1:8081", "http://localhost:5173", "http://127.0.0.1:5173"]'
    volumes:
      - staging_db_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/docs', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 18

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${STAGING_FRONTEND_HOST_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  staging_db_data:
    driver: local
