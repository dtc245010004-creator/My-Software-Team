name: ev-csms

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ev_csms_db
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ev_csms_db"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - ev_net

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite:////app/data/ev_csms.db}
      ENABLE_DEMO_ACCOUNTS: ${ENABLE_DEMO_ACCOUNTS:-true}
      ALLOW_REMOTE_START_SIMULATION: ${ALLOW_REMOTE_START_SIMULATION:-false}
      RECONCILE_INTERVAL_MINUTES: ${RECONCILE_INTERVAL_MINUTES:-15}
      BACKEND_CORS_ORIGINS: '["http://localhost:8080", "http://127.0.0.1:8080", "http://localhost:5173", "http://127.0.0.1:5173"]'
    ports:
      - "${BACKEND_HOST_PORT:-8001}:8000"
    volumes:
      - sqlite_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/docs', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 18
    restart: unless-stopped
    networks:
      - ev_net

  ocpp-simulator:
    image: ev-csms-simulator:1.0.0
    build:
      context: .
      dockerfile: tools/ocpp-spike/Dockerfile
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-sqlite:////app/data/ev_csms.db}
      SIMULATOR_CHARGE_POINT_COUNT: ${SIMULATOR_CHARGE_POINT_COUNT:-20}
      SIMULATOR_WS_URL: ws://backend:8000/ocpp
      SIMULATOR_HEARTBEAT_SECONDS: ${SIMULATOR_HEARTBEAT_SECONDS:-15}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped
    networks:
      - ev_net

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks:
      - ev_net

volumes:
  postgres_data:
    name: ev-sprint3_postgres_data
  sqlite_data:
    name: ev-sprint3_sqlite_data

networks:
  ev_net:
    driver: bridge
